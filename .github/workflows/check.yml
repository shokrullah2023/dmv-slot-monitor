name: DMV slot check

on:
  schedule:
    # Nominally every 5 minutes, but GitHub's scheduler is best-effort and
    # often skips/delays these — cron-job.org poking workflow_dispatch every
    # 10 minutes is the reliable driver; this schedule is backup coverage.
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dmv-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for early slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ONCE: "1"
          STATE_FILE: state.json
          # Include same-day openings (drop-everything-and-drive slots)
          MIN_DAYS: "0"
          # ~1 hour of consecutive failures before the warning push
          ERROR_ALERT_AFTER: "6"
        run: python monitor.py

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "dmv-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
