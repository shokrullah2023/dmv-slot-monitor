name: DMV slot check

on:
  schedule:
    # Every 10 minutes (GitHub may add a few minutes of delay under load).
    # Off-peak minutes (:03, :13, ...) get dispatched more reliably than :00.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: dmv-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for early slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ONCE: "1"
          STATE_FILE: state.json
          # ~1 hour of consecutive failures before the warning push
          ERROR_ALERT_AFTER: "6"
        run: python monitor.py

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "dmv-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
